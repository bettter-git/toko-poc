<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Toko — Asistente</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  :root{
    --page-bg:#e9eaee;
    --page-bg-dark:#1b1c20;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --page-bg: var(--page-bg-dark); }
  }
  :root[data-theme="dark"]{ --page-bg: var(--page-bg-dark); }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--page-bg);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:24px 12px;
  }

  /* ---------- Phone shell (mismo que la app Toko) ---------- */
  .phone{
    position:relative;
    width:390px; max-width:100%;
    height:812px; max-height:92vh;
    background:#0c0d10;
    border-radius:46px;
    padding:14px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.04);
  }
  .screen{
    position:relative;
    width:100%; height:100%;
    background:#f4f5f7;
    border-radius:34px;
    overflow:hidden;
    display:flex; flex-direction:column;
  }
  .notch{
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:120px; height:26px; background:#0c0d10; border-radius:0 0 16px 16px; z-index:50;
  }

  /* ---------- Header (modo chat) ---------- */
  #chatHeader{
    flex:none; background:#fff; border-bottom:1px solid #ececec;
    display:none; align-items:center; gap:10px;
    padding:16px 16px 12px;
    opacity:0; transform:translateY(-6px);
    transition:opacity .3s ease, transform .3s ease;
  }
  #chatHeader.visible{ opacity:1; transform:translateY(0); }
  #chatHeader .back{
    background:none; border:none; color:#6b7280; font-size:14.5px; font-weight:500;
    display:flex; align-items:center; cursor:pointer; padding:4px 2px 4px 0; font-family:inherit;
  }
  .agent-avatar{
    width:36px; height:36px; border-radius:50%; flex:none;
    background:#f6c945; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .agent-avatar img{ width:100%; height:100%; object-fit:cover; display:block; }
  .agent-meta{ flex:1; min-width:0; }
  .agent-meta b{ display:block; font-size:15px; font-weight:800; color:#12141a; }
  .agent-status{ display:flex; align-items:center; gap:5px; font-size:12px; color:#6b7280; margin-top:1px; }
  .agent-status .dot{ width:6px; height:6px; border-radius:50%; background:#0b7a4b; flex:none; }
  #chatHeader .more{ background:none;border:none;color:#6b7280;cursor:pointer;padding:4px;font-family:inherit; }

  /* ---------- Estado inicial ("hero") ---------- */
  #welcomeView{
    flex:1; overflow-y:auto; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    padding:28px 26px 12px;
    transition:opacity .3s ease, transform .3s ease;
  }
  #welcomeView::-webkit-scrollbar{ width:0; }

  .hero-avatar-wrap{ position:relative; width:80px; height:80px; margin:0 0 22px; }
  .hero-avatar-wrap::before{
    content:''; position:absolute; inset:-13px; border-radius:50%;
    background:conic-gradient(from 0deg, #f6c945, #fff2c9, #f6c945, #ffdf7a, #f6c945);
    filter:blur(15px); opacity:.6;
    animation:heroSpin 7s linear infinite;
  }
  @keyframes heroSpin{ to{ transform:rotate(360deg); } }
  .hero-avatar{
    position:relative; z-index:1; width:80px; height:80px; border-radius:50%;
    overflow:hidden; background:#f6c945; box-shadow:0 10px 28px rgba(18,20,26,.16);
  }
  .hero-avatar img{ width:100%; height:100%; object-fit:cover; display:block; }

  .hero-h1{
    font-size:27px; line-height:1.22; font-weight:800; color:#12141a;
    margin:0 0 10px; max-width:280px;
  }
  .hero-sub{
    font-size:14px; line-height:1.5; color:#6b7280; margin:0 0 28px; max-width:280px;
  }

  .suggest-grid{ display:flex; flex-direction:column; gap:10px; width:100%; max-width:320px; }
  .suggest-card{
    display:flex; align-items:center; gap:12px; text-align:left;
    background:#fff; border:1px solid #ececec; border-radius:16px;
    padding:13px 14px; cursor:pointer; font-family:inherit;
    transition:border-color .15s ease, transform .1s ease;
  }
  .suggest-card:active{ transform:scale(.98); border-color:#f6c945; }
  .suggest-ic{
    flex:none; width:36px; height:36px; border-radius:11px; background:#fdf3d6;
    display:flex; align-items:center; justify-content:center; color:#b8860b;
  }
  .suggest-tx b{ display:block; font-size:14px; font-weight:700; color:#12141a; margin-bottom:1px; }
  .suggest-tx span{ font-size:12.5px; color:#8a909b; }

  /* ---------- Chat body ---------- */
  #chatBody{
    flex:1; overflow-y:auto; padding:16px 16px 10px;
    display:none; flex-direction:column; gap:12px;
    opacity:0; transition:opacity .35s ease;
  }
  #chatBody.visible{ opacity:1; }
  #chatBody::-webkit-scrollbar{ width:0; }

  .day-sep{ text-align:center; font-size:11.5px; color:#9aa0aa; font-weight:600; margin:4px 0 2px; }

  .msg-row{ display:flex; gap:8px; align-items:flex-end; }
  .msg-row.user{ flex-direction:row-reverse; }
  .msg-row .mini-avatar{
    width:24px; height:24px; border-radius:50%; flex:none; background:#f6c945; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .msg-row .mini-avatar img{ width:100%; height:100%; object-fit:cover; display:block; }
  .msg-row.user .mini-avatar{ visibility:hidden; }

  .bubble-col{ display:flex; flex-direction:column; max-width:76%; }
  .msg-row.user .bubble-col{ align-items:flex-end; }

  .bubble{
    padding:11px 14px; border-radius:17px; font-size:14.5px; line-height:1.48;
    word-wrap:break-word; white-space:pre-wrap;
  }
  .bubble.agent{ background:#fff; color:#12141a; border:1px solid #ececec; border-bottom-left-radius:5px; }
  .bubble.user{ background:#12141a; color:#fff; border-bottom-right-radius:5px; }
  .bubble img.attach{ display:block; max-width:100%; border-radius:11px; margin-top:6px; }

  .msg-time{ font-size:10.5px; color:#b3b7bf; margin-top:4px; padding:0 3px; }
  .msg-row.user .msg-time{ text-align:right; }

  /* cursor de "escribiendo" al final del texto en streaming */
  .caret{
    display:inline-block; width:2px; height:14px; background:#12141a; margin-left:2px;
    vertical-align:-2px; animation:caretBlink .9s steps(1) infinite;
  }
  @keyframes caretBlink{ 50%{ opacity:0; } }

  /* typing indicator (antes de que empiece a llegar texto) */
  .typing-dots{ display:flex; gap:4px; align-items:center; padding:2px 0; }
  .typing-dots span{
    width:6px; height:6px; border-radius:50%; background:#c7cad0;
    animation:tdot 1.1s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2){ animation-delay:.15s; }
  .typing-dots span:nth-child(3){ animation-delay:.3s; }
  @keyframes tdot{ 0%,60%,100%{ transform:translateY(0); opacity:.5;} 30%{ transform:translateY(-4px); opacity:1;} }

  /* ---------- Input bar (siempre visible) ---------- */
  .chat-input-bar{
    flex:none; background:#fff; border-top:1px solid #ececec;
    padding:10px 12px 16px; display:flex; align-items:flex-end; gap:8px;
  }
  .icon-btn{
    width:40px; height:40px; border-radius:50%; flex:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-family:inherit;
  }
  .attach-btn{ background:#fff; border:1.5px solid #e2e4e9; color:#6b7280; }
  .attach-btn:active{ background:#f4f5f7; }
  .input-wrap{
    flex:1; display:flex; align-items:center; background:#f4f5f7; border-radius:22px;
    padding:2px 4px 2px 16px; border:1.5px solid transparent;
  }
  .input-wrap:focus-within{ border-color:#f6c945; background:#fff; }
  #msgInput{
    flex:1; border:none; background:transparent; resize:none; font-family:inherit;
    font-size:14.5px; padding:10px 0; max-height:90px; line-height:1.4; color:#12141a;
  }
  #msgInput:focus{ outline:none; }
  ::placeholder{ color:#9aa0aa; }
  .send-btn{ background:#f6c945; border:none; color:#12141a; }
  .send-btn:disabled{ background:#f3e3ae; color:#c9b877; cursor:not-allowed; }

  input[type=file]{ display:none; }
</style>
</head>

<script>
/* =========================================================================
   CONEXIÓN CON EL AGENTE (n8n)
   -------------------------------------------------------------------------
   Modo DEMO activo: respuestas simuladas para poder revisar el diseño sin
   depender todavía del agente en n8n.

   Cuando el AI Agent + Webhook estén listos:
   1) WEBHOOK_URL = "https://bettter.app.n8n.cloud/webhook/toko-agente"
   2) USE_DEMO_MODE = false
   3) Body enviado: { sessionId, mensaje, imagen_base64? }
      Respuesta esperada del agente: { respuesta: "texto..." }
   ========================================================================= */
const WEBHOOK_URL = "";
const USE_DEMO_MODE = true;

function getSessionId(){
  let id = localStorage.getItem('toko_session_id');
  if(!id){
    id = 'sess_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    localStorage.setItem('toko_session_id', id);
  }
  return id;
}
const sessionId = getSessionId();

let messages = [];
let pendingImage = null;
let inChatMode = false;

function nowLabel(){
  return new Date().toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit'});
}

function enterChatMode(){
  if(inChatMode) return;
  inChatMode = true;

  const w = document.getElementById('welcomeView');
  w.style.opacity='0';
  w.style.transform='translateY(-10px) scale(.97)';
  setTimeout(()=>{ w.style.display='none'; }, 300);

  const h = document.getElementById('chatHeader');
  h.style.display='flex';
  requestAnimationFrame(()=> h.classList.add('visible'));

  const cb = document.getElementById('chatBody');
  cb.style.display='flex';
  requestAnimationFrame(()=> cb.classList.add('visible'));
}

function renderChat(){
  const el = document.getElementById('chatBody');
  let html = `<div class="day-sep">Hoy</div>`;
  messages.forEach((m, idx)=>{

function escapeHtml(str){
  const d = document.createElement('div');
  d.innerText = str;
  return d.innerHTML;
}

function autoGrow(ta){
  ta.style.height='auto';
  ta.style.height=Math.min(ta.scrollHeight,90)+'px';
}
function toggleSend(){
  const t = document.getElementById('msgInput').value.trim();
  document.getElementById('sendBtn').disabled = !t && !pendingImage;
}
function onKeyDown(e){
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
}
function quickReply(text){
  document.getElementById('msgInput').value=text;
  toggleSend();
  sendMessage();
}

let showTyping=false;
async function sendMessage(){
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text && !pendingImage) return;

  enterChatMode();

  messages.push({role:'user', text: text||'(imagen adjunta)', image:pendingImage, time: nowLabel()});
  const imgToSend = pendingImage;
  pendingImage = null;
  input.value=''; autoGrow(input); toggleSend();
  renderChat();

  showTyping = true; renderChat();

  let respuesta;
  try{
    respuesta = await askAgent(text, imgToSend);
  }catch(err){
    respuesta = 'No pude conectarme con el agente. Intenta de nuevo en unos segundos.';
    console.error(err);
  }
  showTyping = false;
  messages.push({role:'agent', text:'', time: nowLabel()});
  renderChat();

  const bubbles = document.querySelectorAll('#chatBody .bubble.agent');
  const target = bubbles[bubbles.length-1];
  await streamInto(target, respuesta);
  messages[messages.length-1].text = respuesta;
}

function streamInto(el, fullText){
  return new Promise(resolve=>{
    const words = fullText.split(' ');
    let i=0;
    const caret = document.createElement('span');
    caret.className='caret';
    function step(){
      el.textContent = words.slice(0, i+1).join(' ');
      el.appendChild(caret);
      const cb = document.getElementById('chatBody');
      cb.scrollTop = cb.scrollHeight;
      i++;
      if(i<words.length){ setTimeout(step, 32+Math.random()*38); }
      else { caret.remove(); resolve(); }
    }
    step();
  });
}

async function askAgent(mensaje, imagenBase64){
  if(USE_DEMO_MODE){
    await new Promise(r=>setTimeout(r, 700 + Math.random()*500));
    return demoResponse(mensaje, imagenBase64);
  }
  const res = await fetch(WEBHOOK_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ sessionId, mensaje, imagen_base64: imagenBase64 })
  });
  if(!res.ok) throw new Error('Webhook respondió ' + res.status);
  const data = await res.json();
  return data.respuesta || 'No obtuve respuesta del agente.';
}

function demoResponse(mensaje, imagen){
  const m = (mensaje||'').toLowerCase();
  if(imagen) return 'Recibí la imagen, gracias. Estoy procesando los datos de la identificación...';
  if(m.includes('nueva solicitud')) return '¡Perfecto! Empecemos. ¿Me compartes el teléfono del cliente y una foto de su INE (frente y reverso)?';
  if(m.includes('retomar')) return 'Claro, dime el teléfono del cliente y busco si ya tiene una solicitud en curso.';
  if(m.includes('estatus')) return 'Dime el teléfono o el folio del cliente y te digo en qué paso va su solicitud.';
  if(m.includes('necesito')) return 'Para empezar solo necesito: el teléfono del cliente y una foto de su INE. Yo me encargo del resto.';
  return 'Anotado. (Esta es una respuesta de demostración — conecta el Webhook de n8n para respuestas reales.)';
}

function triggerFile(){ document.getElementById('fileInput').click(); }
document.getElementById('fileInput').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    pendingImage = ev.target.result;
    toggleSend();
  };
  reader.readAsDataURL(file);
});
</script>
